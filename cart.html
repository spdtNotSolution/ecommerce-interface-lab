<html lang="en">
<head>

    <title>Document</title>

    <style>
        img{
            width: 200px;
        }

        ul, li{
            list-style: none;
        }

        .checkout-btn{
            text-decoration: none;
            color: white;
            background-color: black;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Your Shopping Cart</h1>
    </header>

    <ul>
        <li>
            <img src="/images/cam.png">
            <h3>Fujifilm X-10 </h3>
            <p>Price: ₱16,300</p>
            <label>
                Quantity: 
                <input type="number">
            </label>
        </li>

        <li>
            <img src="/images/cam.png">
            <h3>Canon EOS Camera</h3>
            <p>Price: ₱25,000</p>
            <label>
                Quantity: 
                <input type="number">
            </label>
        </li>

        <li>
            <img src="/images/cam.png">

            <label>
                Quantity: 
                <input type="number">
            </label>

    <section>
        <h2>Subtotal: ₱71,300</h2>
        <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
